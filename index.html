<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="777plus 南货航备考资料库">
    <meta name="theme-color" content="#ffffff">
    <script>
      (() => {
        let theme = "light";
        try {
          if (window.localStorage.getItem("777plus-theme") === "dark") theme = "dark";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#121315" : "#ffffff");
      })();
    </script>
    <title>777plus</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="app-header">
        <div class="topbar-inner">
          <div class="topbar-brand">
            <button class="icon-button mobile-menu" type="button" id="mobileMenu" aria-label="打开导航" title="导航"><i data-lucide="menu"></i></button>
            <a class="brand" href="#/focus" aria-label="返回考试通告" title="考试通告">
              <i data-lucide="book-marked" aria-hidden="true"></i>
            </a>
          </div>

          <div class="global-search">
            <i data-lucide="search" aria-hidden="true"></i>
            <input id="globalSearch" type="search" placeholder="搜索重点、文献、名词与模板" autocomplete="off" spellcheck="false">
            <kbd>/</kbd>
            <div class="search-results" id="searchResults" hidden></div>
          </div>

          <div class="header-actions">
            <button class="icon-button" type="button" id="themeToggle" aria-label="切换至夜间模式" aria-pressed="false" title="切换至夜间模式"><i data-lucide="moon" aria-hidden="true"></i></button>
            <button class="icon-button export-button" type="button" id="exportHtml" aria-label="下载"><i data-lucide="download"></i></button>
            <button class="icon-button" type="button" id="guideOpen" aria-label="打开复习指引" title="复习指引"><i data-lucide="circle-help"></i></button>
          </div>
        </div>
      </header>

      <div class="app-frame">
        <aside class="app-sidebar" id="appSidebar">
          <div class="sidebar-scroll">
            <section class="sidebar-group">
              <p class="sidebar-label">复习模块</p>
              <nav class="main-nav" aria-label="主导航">
                <a href="#/focus" data-module-link="focus"><i data-lucide="target"></i><span>考试通告</span></a>
                <a href="#/materials" data-module-link="materials"><i data-lucide="library"></i><span>文献综述</span></a>
                <a href="#/terms" data-module-link="terms"><i data-lucide="book-marked"></i><span>名词解释</span></a>
                <a href="#/templates" data-module-link="templates"><i data-lucide="notebook-pen"></i><span>答题模板</span></a>
                <a href="#/experience" data-module-link="experience"><i data-lucide="image"></i><span>大神经验</span></a>
                <a href="#/essentials" data-module-link="essentials"><i data-lucide="book-open-check"></i><span>没招了，就只看这一个</span></a>
              </nav>
            </section>
            <div class="section-navigation" id="sectionNavigation"></div>
          </div>
          <div class="sidebar-footer"><span>飞行部逢考必过</span></div>
        </aside>

        <div class="app-column">
          <aside class="update-banner" aria-label="资料更新">
            <p><strong>资料已更新</strong><span>安全生产法重点、正确政绩观与党建模板</span><time datetime="2026-08-05">2026.08.05</time></p>
          </aside>
          <main class="app-main" id="appMain">
            <div class="loading-state"><span></span><p>正在整理材料</p></div>
          </main>
        </div>
      </div>

      <dialog class="study-guide" id="studyGuide" aria-labelledby="studyGuideTitle">
        <div class="study-guide__header">
          <div>
            <span class="eyebrow">复习指引</span>
            <h2 id="studyGuideTitle">从考试范围开始复习</h2>
          </div>
          <button class="icon-button" type="button" id="guideClose" aria-label="关闭复习指引" title="关闭"><i data-lucide="x"></i></button>
        </div>
        <div class="study-guide__body">
          <section class="guide-item"><span class="guide-item__number">01</span><div><h3>考试通告</h3><p>通读考试范围。</p></div></section>
          <section class="guide-item"><span class="guide-item__number">02</span><div><h3>文献综述</h3><p>按文献目录阅读8份材料。</p></div></section>
          <section class="guide-item"><span class="guide-item__number">03</span><div><h3>名词解释</h3><p>掌握十五个名词及其必记要点。</p></div></section>
          <section class="guide-item"><span class="guide-item__number">04</span><div><h3>答题模板</h3><p>按专项方向或“现状—问题—解决方案—岗位落实”结构组织论述。</p></div></section>
          <section class="guide-item"><span class="guide-item__number">05</span><div><h3>大神经验</h3><p>查看帆姐考点梳理和孟哥笔记图片。</p></div></section>
          <section class="guide-item"><span class="guide-item__number">06</span><div><h3>没招了，就只看这一个</h3><p>核心知识、数字、关键词和主观题表述。</p></div></section>
        </div>
        <div class="study-guide__footer">
          <label><input id="guideRemember" type="checkbox" checked> 不再自动显示</label>
          <button class="guide-primary" type="button" id="guideStart">进入考试通告</button>
        </div>
      </dialog>

      <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="关闭导航" hidden></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
